<body>
    <h1></h1>
    <div class="guess-game">
        <div class="gameerea">

            <div class="inputs"></div>

            <div class="control">
                <button class="check">check</button>
                <button class="hint">Hint <span></span></button>
                <button class="refresh">Refresh</button>
            </div>

            <div class="message"></div>
        </div>



        <div class="key-colors">

            <h2>Key colors</h2>

            <div class="key-color">
                <div class="key inplace"></div>
                <div class="key-text">Correct and in its place</div>
            </div>


            <div class="key-color">
                <div class="key wrongplace"></div>
                <div class="key-text">Correct but not in this place</div>


            </div>

            <div class="key-color">
                <div class="key worng"></div>
                <div class="key-text">worng</div>
            </div>



        </div>
    </div>
